name: "Build and push image"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [released]

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    name: Build and push docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: secrets
        with:
          url: https://vault.afdevops.com
          method: jwt
          role: jwt-github-role
          path: jwt-github
          jwtGithubAudience: https://github.com/AnchorFree
          exportEnv: true
          secrets: |
            secret/devops/cloud_providers/gcp/aura-networking/gar/gh-actions-rw auth | REGISTRY_PASSWORD ;

      - name: Login to GAR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ env.REGISTRY_PASSWORD }}

      # The image name is ssl-watch, not anchorfree/ssl-watch as github.repository would give:
      # the ssl-watch chart in AnchorFree/helm_india_apps deploys
      # us-docker.pkg.dev/aura-networking/docker-registry/ssl-watch.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            us-docker.pkg.dev/aura-networking/docker-registry/ssl-watch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # Pull requests build only, to verify the Dockerfile without publishing a tag.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
