name: "CodeQL Golang"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # On a pull request the action restricts every alerting query to the lines in the diff, so a
  # change that touches no Go file reports nothing. Dispatch scans the whole tree instead, which
  # is what you want to check the scan itself rather than a change.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # go.mod requires a Go version newer than the one preinstalled on some runner images.
    # Without this, autobuild falls back to a toolchain download and the analysis depends on
    # whatever the image happens to ship.
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: 'go'
        # The default suite runs @precision high queries only, which skips
        # go/log-injection and the rest of the medium-precision set.
        queries: security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
