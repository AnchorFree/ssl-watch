name: Gosec

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  # Gosec matches risky patterns whether or not untrusted input reaches them: missing server
  # timeouts, file permissions, binding to all interfaces, unchecked errors. CodeQL reports a
  # finding only when it can trace untrusted input to a sink, so it misses most of these. It never
  # reported the missing http.Server timeouts that gosec flags as G114.
  gosec:
    name: Gosec scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Report through code scanning rather than failing the job. A failing job without an alert
      # is easy to ignore: docker-cert-manager failed this check on every run for a year. An
      # alert stays open until the code is fixed or the alert is dismissed with a reason.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload Gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: gosec.sarif
