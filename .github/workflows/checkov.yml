name: Checkov Scan
on:
  push:
    branches: ["master", "main"]
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  # Inlined from AnchorFree/secops-workflows reusable-checkov.yml. ssl-watch is public and
  # secops-workflows is internal, and a public repository cannot call an internal reusable
  # workflow.
  checkov-scan:
    name: Checkov scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: checkov-scan
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Same skips as secops-workflows. CKV_DOCKER_2 is the HEALTHCHECK check, which
          # Kubernetes ignores; see .trivyignore.yaml.
          skip_check: CKV2_GHA_1,CKV_TF_1,CKV_GHA_7,CKV_DOCKER_2

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
